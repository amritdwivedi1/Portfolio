<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <rect width="900" height="500" fill="#0B0D16"/>
  <rect x="0" y="0" width="900" height="500" fill="url(#grid)"/>
  
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(236,239,246,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Central Shield / Security Symbol -->
  <path d="M450 100 L570 150 L570 290 C570 370 450 420 450 420 C450 420 330 370 330 290 L330 150 Z" fill="#151a29" stroke="#E8A33D" stroke-width="3"/>
  <circle cx="450" cy="240" r="45" fill="none" stroke="#4FB3A9" stroke-width="2"/>
  <polygon points="450,210 460,235 485,240 460,245 450,270 440,245 415,240 440,235" fill="#E8A33D"/>
  
  <!-- Network Nodes -->
  <circle cx="200" cy="180" r="10" fill="#4FB3A9"/>
  <circle cx="700" cy="180" r="10" fill="#4FB3A9"/>
  <circle cx="180" cy="360" r="10" fill="#E8A33D"/>
  <circle cx="720" cy="360" r="10" fill="#E8A33D"/>

  <line x1="200" y1="180" x2="330" y2="200" stroke="rgba(79,179,169,0.4)" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="700" y1="180" x2="570" y2="200" stroke="rgba(79,179,169,0.4)" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="180" y1="360" x2="360" y2="380" stroke="rgba(232,163,61,0.4)" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="720" y1="360" x2="540" y2="380" stroke="rgba(232,163,61,0.4)" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Text Overlay -->
  <text x="450" y="455" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="bold" fill="#ECEFF6" text-anchor="middle">HerSentinel</text>
  <text x="450" y="480" font-family="'JetBrains Mono', monospace" font-size="14" fill="#4FB3A9" text-anchor="middle">REACT NATIVE • NODE.JS • HTTPS • JWT • SOS ALERTS</text>
</svg>
